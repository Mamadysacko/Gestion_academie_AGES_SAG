openapi: 3.0.3

info:
  title: API AGES — Gestion Académie
  version: 1.0.0
  description: |
    Documentation interactive de l'API PHP AGES. Les routes sont montées sous
    `/Backend_AGES/Route`. Connectez-vous avec `POST /auth/login` avant d'essayer
    les routes protégées : l'API conserve l'authentification dans le cookie de
    session PHP (`PHPSESSID`). Les écritures et les actions sensibles requièrent
    les permissions associées au rôle connecté.

servers:
  - url: http://localhost/Backend_AGES/Route
    description: Installation locale XAMPP (Apache)

security:
  - sessionCookie: []

tags:
  - name: Authentification
  - name: Profil et espace formateur
  - name: Utilisateurs et rôles
  - name: Organisation pédagogique
  - name: Sessions et groupes
  - name: Auditeurs et inscriptions
  - name: Formateurs et salles
  - name: Emplois du temps
  - name: Évaluations et notes
  - name: Présences
  - name: Tableau de bord et rappels
  - name: Rapports et journal

paths:
  /auth/login:
    post:
      tags: [Authentification]
      summary: Ouvrir une session
      description: Utilisez l'e-mail ou le téléphone du compte. Le cookie PHPSESSID est créé à la connexion.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonObject'
            example:
              email: admin@example.com
              password: votre_mot_de_passe
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      tags: [Authentification]
      summary: Fermer la session
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /auth/me:
    get:
      tags: [Authentification]
      summary: Obtenir l'utilisateur de la session
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /auth/profile:
    get:
      tags: [Profil et espace formateur]
      summary: Consulter son profil
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [Profil et espace formateur]
      summary: Modifier son profil
      description: 'Champs autorisés : nom, prenom, email, telephone, current_password et new_password.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonObject'
            example:
              nom: Diallo
              prenom: Awa
              email: awa@example.com
              telephone: '+221770000000'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /auth/trainer-portal:
    get:
      tags: [Profil et espace formateur]
      summary: Tableau de bord du formateur connecté
      parameters:
        - $ref: '#/components/parameters/Date'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /auth/trainer-portal/feuille:
    get:
      tags: [Profil et espace formateur]
      summary: Obtenir la feuille de présence du formateur
      parameters:
        - $ref: '#/components/parameters/Date'
        - name: id_session
          in: query
          required: false
          schema:
            type: integer
        - name: id_groupe
          in: query
          required: false
          schema:
            type: integer
        - name: id_salle
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /auth/trainer-portal/resultats/{id}:
    get:
      tags: [Profil et espace formateur]
      summary: Résultats d'une session pour le formateur
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /auth/trainer-portal/presences-bulk:
    post:
      tags: [Profil et espace formateur]
      summary: Saisir plusieurs présences depuis l'espace formateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonObject'
            example:
              date_presence: '2026-10-22'
              statut: present
              ids: [1, 2]
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /auth/trainer-portal/presences:
    post:
      tags: [Profil et espace formateur]
      summary: Saisir une présence depuis l'espace formateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonObject'
            example:
              id_inscription: 1
              date_presence: '2026-10-22'
              statut: present
              id_emploi_du_temps: 1
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /auth/trainer-portal/notes:
    post:
      tags: [Profil et espace formateur]
      summary: Saisir une note depuis l'espace formateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonObject'
            example:
              id_evaluation: 1
              id_parametre: 1
              id_inscription: 1
              note: 15
              observation: Travail satisfaisant
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'

  /users:
    get:
      tags: [Utilisateurs et rôles]
      summary: Lister les utilisateurs
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Utilisateurs et rôles]
      summary: Créer un utilisateur
      description: nom, prenom, password et role_id sont requis ; fournir un email ou un telephone. Pour un formateur, matricule est également requis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonObject'
            example:
              nom: Diallo
              prenom: Awa
              email: awa@example.com
              telephone: '+221770000000'
              password: mot_de_passe
              role_id: 1
      responses:
        '201':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /users/authenticate:
    post:
      tags: [Authentification]
      summary: Authentification (alias historique)
      description: Alias de POST /auth/login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
