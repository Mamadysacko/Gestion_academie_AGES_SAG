    put:
      tags: [Utilisateurs et rôles]
      summary: Modifier un utilisateur
      requestBody:
        $ref: '#/components/requestBodies/JsonBody'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Utilisateurs et rôles]
      summary: Supprimer un utilisateur
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
