          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /tableau-de-bord/rapport:
    get:
      tags: [Tableau de bord et rappels]
      summary: Obtenir le rapport synthétique du tableau de bord
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /rappels:
    get:
      tags: [Tableau de bord et rappels]
      summary: Lister les rappels de l'utilisateur connecté
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /rapports:
    get:
      tags: [Rapports et journal]
      summary: Obtenir le catalogue des rapports disponibles
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /rapports/{code}:
    get:
      tags: [Rapports et journal]
      summary: Générer un rapport
      description: Consultez d'abord GET /rapports ; les filtres acceptés dépendent du rapport choisi.
      parameters:
        - name: code
          in: path
          required: true
          description: Code présent dans le catalogue des rapports.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /journal:
    get:
      tags: [Rapports et journal]
      summary: Rechercher dans le journal des opérations
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: ressource
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: succes
          in: query
          required: false
          schema:
            type: boolean
        - name: debut
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: fin
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 300
            minimum: 1
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: Cookie créé automatiquement après l'appel à POST /auth/login.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Date:
      name: date
      in: query
      required: false
      description: Date au format AAAA-MM-JJ.
      schema:
        type: string
        format: date
  requestBodies:
    JsonBody:
      required: true
      description: Corps JSON attendu par l'opération. Les champs dépendent de la ressource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonObject'
          example:
            champ: valeur
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
      description: Objet JSON ; voir la description de la route pour les champs requis.
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          description: Données de la réponse, de forme variable selon la route.
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
  responses:
    Success:
      description: Réponse JSON de l'opération.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Error:
      description: Erreur JSON (validation, authentification, permissions ou ressource introuvable).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
