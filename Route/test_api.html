<head>

    <style>
        body {

            background: white;

        }
        h1 {

        }
        h2 {
            color: #555;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        button.delete {

        }
        button.delete:hover {

        }
        button.update {

        }

        .response {

            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .success {
            border-left: 4px solid #4CAF50;
        }
        .error {

        }
        .input-group {
            margin: 10px 0;
        }
        label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
        }
        input, select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 300px;
        }
    </style>
</head>
<body>
    <h1>🧪 Test API - Backend AGES</h1>

        <button onclick="testGetAnneesAll()">GET - Toutes les années</button>

    <!-- Test Utilisateurs -->

    <!-- Test Niveaux -->
    <div class="container">
        <h2>📊 Niveaux</h2>
        <button onclick="testGetNiveauxAll()">GET - Tous les niveaux</button>
        <button onclick="testCreateNiveau()">POST - Créer niveau</button>

    <!-- Test Types de Formation -->
    <div class="container">
        <h2>🎓 Types de Formation</h2>
        <button onclick="testGetTypesFormationsAll()">GET - Tous les types</button>
        <button onclick="testCreateTypeFormation()">POST - Créer type</button>
        <div id="responseTypesFormations" class="response"></div>
    </div>

    <!-- Test Formateurs -->
    <div class="container">
        <h2>👨‍🏫 Formateurs</h2>
        <button onclick="testGetFormateursAll()">GET - Tous les formateurs</button>
        <button onclick="testGetFormateursActifs()">GET - Formateurs actifs</button>
        <button onclick="testCreateFormateur()">POST - Créer formateur</button>
        <div id="responseFormateurs" class="response"></div>
    </div>

    <!-- Test Salles -->
    <div class="container">
        <h2>🚪 Salles</h2>
        <button onclick="testGetSallesAll()">GET - Toutes les salles</button>
        <button onclick="testGetSallesDisponibles()">GET - Salles disponibles</button>

    <!-- Test Sessions -->
    <div class="container">
        <h2>📚 Sessions</h2>
        <button onclick="testGetSessionsAll()">GET - Toutes les sessions</button>
        <button onclick="testCreateSession()">POST - Créer session</button>
        <div id="responseSessions" class="response"></div>
    </div>

    <!-- Test Groupes -->
    <div class="container">
        <h2>👥 Groupes</h2>
        <button onclick="testGetGroupesAll()">GET - Tous les groupes</button>
        <button onclick="testCreateGroupe()">POST - Créer groupe</button>
        <div id="responseGroupes" class="response"></div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost/Backend_AGES/Route/api.php';

        function displayResponse(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            element.textContent = JSON.stringify(data, null, 2);
            element.className = isError ? 'response error' : 'response success';
        }

        async function apiCall(endpoint, method = 'GET', body = null) {
            try {
                const options = {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    }
                };

                if (body) {
                    options.body = JSON.stringify(body);
                }

                const response = await fetch(`${API_BASE_URL}/${endpoint}`, options);
                const data = await response.json();
                return { data, isError: !response.ok };
            } catch (error) {
                return { 
                    data: { success: false, error: error.message }, 
                    isError: true 
                };
            }
        }

        // ============ Années Scolaires ============
        async function testGetAnneesAll() {
            const result = await apiCall('annees-scolaires');
            displayResponse('responseAnnees', result.data, result.isError);
        }

        async function testGetAnneeActive() {
            const result = await apiCall('annees-scolaires/active');
            displayResponse('responseAnnees', result.data, result.isError);
        }

        async function testCreateAnnee() {
            const data = {
                libelle: '2024-2025',
                date_debut: '2024-09-01',
                date_fin: '2025-06-30',
                statut: 1
            };
            const result = await apiCall('annees-scolaires', 'POST', data);
            displayResponse('responseAnnees', result.data, result.isError);
        }

        // ============ Rôles ============
        async function testGetRolesAll() {
            const result = await apiCall('roles');
            displayResponse('responseRoles', result.data, result.isError);
        }

        async function testCreateRole() {
            const data = {
                code: 'admin',
                nom: 'Administrateur'
            };
            const result = await apiCall('roles', 'POST', data);
            displayResponse('responseRoles', result.data, result.isError);
        }

        async function testGetRoleByCode() {
            const result = await apiCall('roles/code/admin');
            displayResponse('responseRoles', result.data, result.isError);
        }

        // ============ Utilisateurs ============
        async function testGetUsersAll() {
            const result = await apiCall('users');
            displayResponse('responseUsers', result.data, result.isError);
        }

        async function testCreateUser() {
            const data = {
                nom: 'Diop',
                prenom: 'Amadou',
                email: 'amadou.diop@example.com',
                telephone: '771234567',
                password: 'password123',
                role_id: 1,
                actif: 1
            };
            const result = await apiCall('users', 'POST', data);
            displayResponse('responseUsers', result.data, result.isError);
        }

        async function testAuthenticateUser() {
            const data = {
                email: 'amadou.diop@example.com',
                password: 'password123'
            };
            const result = await apiCall('users/authenticate', 'POST', data);
            displayResponse('responseUsers', result.data, result.isError);
        }

        // ============ Départements ============
        async function testGetDepartementsAll() {
            const result = await apiCall('departements');
            displayResponse('responseDepartements', result.data, result.isError);
        }

        async function testCreateDepartement() {
            const data = {
                code: 'ANGLAIS',
                libelle: 'Département d\'Anglais'
            };
            const result = await apiCall('departements', 'POST', data);
            displayResponse('responseDepartements', result.data, result.isError);
        }

        async function testGetDepartementByCode() {
            const result = await apiCall('departements/code/ANGLAIS');
            displayResponse('responseDepartements', result.data, result.isError);
        }

        // ============ Niveaux ============
        async function testGetNiveauxAll() {
            const result = await apiCall('niveaux');
            displayResponse('responseNiveaux', result.data, result.isError);
        }

        async function testCreateNiveau() {

            };

            displayResponse('responseNiveaux', result.data, result.isError);

        // ============ Salles ============

        // ============ Sessions ============

            const result = await apiCall('sessions');
            displayResponse('responseSessions', result.data, result.isError);

        async function testCreateSession() {

                id_annee: 1,
                id_type_formation: 1,
                id_niveau: 1,
                code: 'ANG-A1-2024',

        // ============ Groupes ============
        async function testGetGroupesAll() {

        async function testCreateGroupe() {

                id_session: 1,

        }
    </script>
